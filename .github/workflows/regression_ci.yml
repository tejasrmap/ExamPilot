name: ExamPilot 2.0 Regression & Quality Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-ocr-regression:
    name: Python 3.10 Tests & OCR Regression
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0 || sudo apt-get install -y libgl1

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install fastapi uvicorn sqlalchemy alembic pydantic-settings python-jose bcrypt python-multipart httpx pytest-asyncio passlib email-validator pymupdf

    - name: Run Alembic Database Migrations
      run: |
        python -m alembic upgrade head

    - name: Run Dedicated OCR and MCQ Reliability Regression Tests
      run: |
        python -m pytest -s tests/test_ocr_mcq_regression.py

    - name: Run Complete Test Suite
      run: |
        python -m pytest -s tests/ --ignore=tests/test_ocr_mcq_regression.py

  frontend-build:
    name: Next.js Frontend Production Build (Node 20 LTS)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 20 LTS
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Run Frontend Option Identity Unit Tests
      run: |
        cd frontend
        npm test

    - name: Build Next.js Production Frontend
      run: |
        cd frontend
        npm run build
