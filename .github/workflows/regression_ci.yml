name: ExamPilot 2.0 Regression & Quality Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install fastapi uvicorn sqlalchemy alembic pydantic-settings python-jose bcrypt python-multipart httpx pytest-asyncio

    - name: Run OCR and MCQ Reliability Regression Tests
      run: |
        python -m pytest -s tests/test_ocr_mcq_regression.py

    - name: Run Complete Test Suite
      run: |
        python -m pytest -s tests/test_backend_ocr_parser.py tests/test_parser.py tests/test_domain_detector.py tests/test_backend_api.py tests/test_security_audit.py tests/test_chrome_extension.py tests/test_ocr_stress_audit.py tests/test_e2e_journey_audit.py tests/test_concurrency_and_performance.py
